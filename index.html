<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stage Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Stage Lab: 3D editor for stage and lighting visualizations">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: scéna vždy dominuje; panel nástrojov je bočný stĺpec na širokých oknách, spodný posuvný panel na úzkych a bočný stĺpec s ikonami na telefóne na šírku. Tmavý svet osvetľovacieho pultu, akcent volfrámová jantárová. */
:root{
  --bg:#0c0b0a;
  --surface:#171513;
  --surface2:#221f1c;
  --surface3:#2c2824;
  --line:rgba(255,236,214,.12);
  --fg:#f1ece4;
  --muted:#a9a196;
  --accent:#ffb347;
  --accentInk:#1a1206;
  --danger:#ff7b6b;
  --ok:#7fd49b;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bar-h:52px;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.4 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
svg{flex:0 0 auto}
#app{height:100%;display:flex;flex-direction:column;min-width:0}

/* horná lišta */
.bar{flex:0 0 auto;height:var(--bar-h);display:flex;align-items:center;gap:8px;padding-block:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.brand{font:700 21px/1 var(--f-display);letter-spacing:.02em;white-space:nowrap;color:var(--accent)}
.projbtn{display:flex;align-items:center;gap:7px;min-width:0;flex:0 1 auto;max-width:280px;height:36px;padding:0 10px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);cursor:pointer}
.projbtn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.dot.pending{background:var(--accent)}
.dot.err{background:var(--danger)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:2px;flex:0 0 auto;height:36px}
.seg button{border:0;background:none;padding:0 11px;border-radius:7px;cursor:pointer;font:600 15px/1 var(--f-display);letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.spacer{flex:1 1 auto;min-width:0}
.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:36px;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:0 10px;cursor:pointer;font:600 15px/1 var(--f-display);letter-spacing:.02em;white-space:nowrap}
.ib:disabled{opacity:.35;cursor:default}
.ib.acc{background:var(--accent);color:var(--accentInk);border-color:transparent}

/* hlavná plocha */
.main{flex:1 1 auto;min-height:0;min-width:0;display:flex;flex-direction:row;position:relative}
.view{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden;background:#050505}
#c3d,#cplan{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cplan{background:#121110}
#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.vbar{position:absolute;top:8px;left:0;right:0;display:flex;gap:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;overflow-x:auto;scrollbar-width:none;pointer-events:none}
.vbar::-webkit-scrollbar{display:none}
.vbar>*{pointer-events:auto;flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;background:rgba(15,13,11,.82);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:0 12px;font:600 14.5px/1 var(--f-display);letter-spacing:.02em;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accentInk);border-color:transparent}
.pseg{display:flex;height:34px;padding:2px;border-radius:999px;background:rgba(15,13,11,.82);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pseg button{border:0;background:none;border-radius:999px;padding:0 11px;font:600 14.5px/1 var(--f-display);letter-spacing:.02em;color:var(--muted);cursor:pointer;white-space:nowrap}
.pseg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
select.pill{max-width:170px;appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat;background-color:rgba(15,13,11,.82)}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;max-width:min(440px,calc(100% - 24px));font-size:12.5px;line-height:1.35;color:var(--fg);background:rgba(15,13,11,.82);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;transition:opacity .4s ease}
.hint.gone{opacity:0;pointer-events:none}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:18px;width:116px;height:116px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,179,71,.9)}
.ovbox{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;background:rgba(15,13,11,.88);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;max-width:calc(100% - 24px)}
.ovbox input{width:120px;accent-color:var(--accent)}

/* panel */
.panel{flex:0 0 clamp(300px,27vw,400px);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.grip{display:none}
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:6px;border-bottom:1px solid var(--line)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;border:0;background:none;color:var(--muted);padding:6px 2px;border-radius:9px;cursor:pointer;font:600 12.5px/1 var(--f-display);letter-spacing:.02em}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface2);color:var(--fg)}
.tabs button[aria-selected="true"] svg{color:var(--accent)}
.pbody{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px calc(24px + env(safe-area-inset-bottom,0px))}

/* obsah panelu */
.ph-head{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.ph-head i{width:28px;height:28px;border-radius:7px;flex:0 0 auto;border:1px solid var(--line)}
.ph-head input{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--line);font:600 20px/1.2 var(--f-display);padding:2px 0}
.ph-head h2{font:700 20px/1.1 var(--f-display);margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 10px;line-height:1.45}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 6px}
details.sec{border-top:1px solid var(--line);padding:2px 0}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font:600 16.5px/1 var(--f-display);letter-spacing:.02em;padding:12px 0 8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
details.sec:not([open])>summary::after{transform:rotate(-45deg)}
.f{display:grid;grid-template-columns:minmax(0,104px) minmax(0,1fr) 66px;align-items:center;gap:8px;margin:5px 0}
.f label{color:var(--muted);font-size:13px;line-height:1.2}
.f input[type=range]{width:100%;accent-color:var(--accent);min-width:0;height:28px;margin:0}
.f .num{width:100%;min-width:0;height:30px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:0 6px}
.f .unit{grid-column:3}
.f select,.f input[type=text],.f input[type=number].wide{grid-column:2 / 4;width:100%;height:34px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:0 8px;min-width:0}
.f input[type=color]{grid-column:2 / 4;width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:0 11px;cursor:pointer;font:600 14.5px/1 var(--f-display);letter-spacing:.02em;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.chip.danger{color:var(--danger)}
.chip.acc{background:var(--accent);color:var(--accentInk);border-color:transparent}
.chip.sm{height:30px;padding:0 9px;font-size:13.5px}
.row2{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);padding:16px 2px;line-height:1.5}
.libcat{font:600 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.libcat:first-of-type{margin-top:4px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.lib{display:flex;align-items:center;gap:8px;min-height:46px;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;text-align:left}
.lib b{font:600 14.5px/1.05 var(--f-display);letter-spacing:.01em;min-width:0}
.lib i{display:block;width:18px;height:18px;border-radius:5px;flex:0 0 auto;border:1px solid var(--line)}
.search{width:100%;height:36px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:0 10px;margin:0 0 6px}
.list{display:flex;flex-direction:column;gap:4px}
.li{display:flex;align-items:center;gap:9px;min-height:42px;padding:5px 6px 5px 10px;border:1px solid transparent;border-radius:10px;background:var(--surface2);cursor:pointer}
.li:hover{border-color:var(--line)}
.li i{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{color:var(--muted);font-size:12px;white-space:nowrap}
.li.on{border-color:var(--accent);background:var(--surface3)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.ph{position:relative;border-radius:9px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--surface2);aspect-ratio:1;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.on{border-color:var(--accent)}
.ph span{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:3px 5px;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea{width:100%;min-height:64px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:100%;overflow-y:auto;padding:16px}
.mbox h2{font:700 24px/1.05 var(--f-display);margin:0 0 10px}
.mbox h3{font:600 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.edcanvas{width:100%;max-height:42vh;object-fit:contain;background:#000;border-radius:10px;display:block;margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(var(--bar-h) + 10px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 12px 9px 14px;border-radius:10px;font-weight:600;z-index:60;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast button{background:var(--bg);color:var(--fg);border:0;border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}

/* stredné okná: menej textu v lište */
@media (max-width:1100px){.status{display:none}}
@media (max-width:640px){
  .brand,.ib .lbl{display:none}
  .ib{padding:0 9px}
  .bar{gap:6px}
  .seg button{padding:0 9px}
  .spacer{display:none}
  .projbtn{flex:1 1 auto;max-width:none}
  .seg .long{display:none}
}
@media (min-width:641px){.seg .short{display:none}}
@media (max-width:400px){#bRedo{display:none}}
.li.proj{flex-wrap:wrap;cursor:default}
.li.proj .grow{flex:1 1 100%;white-space:normal}
.li.proj small{flex:1 1 auto}
/* úzke a vysoké okná: spodný posuvný panel */
@media (max-width:899px) and (min-height:561px){
  .main{flex-direction:column}
  .panel{flex:0 0 auto;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.35);height:46%;transition:height .25s ease}
  .panel[data-size="min"]{height:calc(78px + env(safe-area-inset-bottom,0px))}
  .panel[data-size="full"]{height:82%}
  .panel[data-size="min"] .pbody{display:none}
  .panel[data-size="min"] .tabs{border-bottom:0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .grip{display:block;flex:0 0 auto;height:18px;border:0;background:none;cursor:pointer;padding:0}
  .grip span{display:block;width:42px;height:5px;border-radius:3px;background:var(--muted);opacity:.55;margin:6px auto 0}
  .tabs{padding-top:2px}
  .hint{bottom:10px}
}
/* telefón na šírku a nízke okná: bočný stĺpec s ikonami */
@media (max-height:560px){
  :root{--bar-h:46px}
  .bar .ib,.projbtn,.seg{height:32px}
  .panel{flex:0 0 auto;flex-direction:row;width:min(360px,48vw);border-left:1px solid var(--line)}
  .panel[data-size="min"]{width:auto}
  .panel[data-size="min"] .pbody{display:none}
  .tabs{grid-template-columns:none;grid-auto-rows:minmax(0,1fr);display:grid;width:62px;border-bottom:0;border-right:1px solid var(--line);padding:4px;padding-bottom:max(4px,env(safe-area-inset-bottom,0px));overflow-y:auto}
  .tabs button{padding:4px 2px;font-size:11.5px}
  .pbody{padding-right:max(14px,env(safe-area-inset-right,0px))}
  .grip{display:none}
  #joy{width:96px;height:96px;bottom:12px}
}
@media (max-width:520px){
  .modal{padding:0;align-items:flex-end}
  .mbox{border-radius:16px 16px 0 0;max-height:92%;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .f{grid-template-columns:minmax(0,88px) minmax(0,1fr) 72px}
}
/* zarovnanie, pridávanie, návod */
.recbar{position:absolute;top:50px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(15,13,11,.94);border:1px solid #ff5a4a;border-radius:12px;padding:5px 5px 5px 12px;font:600 14px/1 var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap;z-index:4}
.recbar i{width:10px;height:10px;border-radius:50%;background:#ff5a4a;animation:blink 1s infinite}
.recbar.preview{border-color:var(--accent)}.recbar.preview i{background:var(--accent)}
@keyframes blink{50%{opacity:.25}}
.stepper{grid-column:2 / 4;display:flex;align-items:center;gap:10px}
.stepper .chip{width:44px;justify-content:center;font-size:20px}
.stepper b{font:700 22px/1 var(--f-display);min-width:24px;text-align:center}
.lbl2{color:var(--muted);font-size:13px}
.seg.wide{display:flex;width:100%;margin:2px 0 12px;height:38px}.seg.wide button{flex:1}
.addcfg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.steps{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.step{display:grid;grid-template-columns:24px minmax(0,1.3fr) minmax(0,1.2fr) 70px minmax(0,1fr);gap:6px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px}
.step select,.step input{height:32px;background:var(--surface3);border:1px solid var(--line);border-radius:7px;padding:0 6px;min-width:0;width:100%;color:var(--fg)}
.step .no{font:700 16px/1 var(--f-display);color:var(--accent);text-align:center}
.step .hold{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.stepbtns{grid-column:2 / -1;display:flex;gap:6px;flex-wrap:wrap}
.vidprev{width:100%;max-height:52vh;background:#000;border-radius:10px;display:block;margin-bottom:8px}
@media (max-width:560px){.step{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr)}.step .hold{grid-column:2}.step select[aria-label="Pohyb"]{grid-column:3}}
@media (prefers-reduced-motion:reduce){.recbar i{animation:none}}
.editbar{position:absolute;top:50px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(15,13,11,.94);border:1px solid var(--accent);border-radius:12px;padding:5px 5px 5px 12px;font-weight:600;white-space:nowrap;z-index:3;max-width:calc(100% - 20px)}
.alrow{display:grid;grid-template-columns:minmax(0,78px) repeat(3,minmax(0,1fr));gap:6px;align-items:center;margin:6px 0}
.alrow span{color:var(--muted);font-size:13px}
.alrow .chip{justify-content:center;padding:0 4px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.addcfg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 4px}
.addcfg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.addcfg input,.addcfg select{height:34px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:0 8px;min-width:0;width:100%;color:var(--fg)}
.mbox.help{width:min(760px,100%)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-16px;background:var(--surface);padding:4px 0 8px;margin-top:-4px;z-index:1}
.mhead h2{margin:0}
.helpbody{line-height:1.55;font-size:14px}
.helpbody p{margin:6px 0 10px;max-width:68ch}
.helpbody details{border-top:1px solid var(--line);padding:2px 0}
.helpbody summary{cursor:pointer;font:600 17px/1 var(--f-display);letter-spacing:.02em;padding:12px 0 8px}
.helpbody ul{margin:4px 0 10px;padding-left:18px;max-width:72ch}
.helpbody li{margin:4px 0}
.tw{overflow-x:auto}
.ktab{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 8px}
.ktab td,.ktab th{border-top:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.ktab th{color:var(--muted);font-weight:500}
kbd{display:inline-block;font:600 12px/1 var(--f-body);background:var(--surface3);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 6px;margin:1px 0;color:var(--fg)}
@media (max-width:640px){#bHelp{display:inline-flex}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- v2: gizmo, nastavenia, knižnica, kreslenie stien ---------- */
.ib.icon{padding:0 9px}
.pseg button svg{display:block}
.gz{display:flex;height:34px;padding:2px;border-radius:999px;background:rgba(15,13,11,.82);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.gz button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;border-radius:999px;padding:0 10px;font:600 14px/1 var(--f-display);letter-spacing:.02em;color:var(--muted);cursor:pointer;white-space:nowrap}
.gz button[aria-pressed="true"]{background:var(--accent);color:var(--accentInk)}
.swatches{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px;grid-column:1 / -1}
.swatches button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);cursor:pointer;padding:0}
.swatches button:focus-visible{outline:2px solid var(--accent)}
.libsearch{display:flex;gap:6px;margin:0 0 8px}
.libcats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 8px}
.libcats::-webkit-scrollbar{display:none}
.lib small{display:block;color:var(--muted);font:400 11.5px/1.2 var(--f-body);margin-top:2px}
.lib .ico{width:30px;height:30px;flex:0 0 auto;border-radius:7px;background:var(--surface3);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.lib .ico i{width:16px;height:16px;border-radius:4px;border:0}
.wallpad{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:3;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;background:rgba(15,13,11,.94);border:1px solid var(--accent);border-radius:12px;padding:6px 8px;max-width:calc(100% - 20px)}
.wallpad label{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
.wallpad input{width:70px;height:32px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:0 6px;color:var(--fg)}
.wallpad b{font:600 14px/1 var(--f-display);color:var(--fg);white-space:nowrap}
.walls{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.wrow{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 30px;gap:6px;align-items:center}
.wrow span{color:var(--accent);font:700 14px/1 var(--f-display);text-align:center}
.wrow input{height:30px;width:100%;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:0 6px;color:var(--fg);font-variant-numeric:tabular-nums}
.wrow input:disabled{opacity:.6}
.wrow .x{height:30px;border:1px solid var(--line);background:var(--surface2);border-radius:7px;color:var(--danger);cursor:pointer}
.whead{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 30px;gap:6px;font-size:12px;color:var(--muted)}
.setgrid{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:8px 12px;align-items:center;margin:6px 0 10px}
.setgrid label{color:var(--muted);font-size:13px}
.setgrid select{height:34px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:0 8px;min-width:0;width:100%}
.langpick{display:flex;gap:6px;flex-wrap:wrap}
.drop{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(255,179,71,.12);border:2px dashed var(--accent);font:600 18px/1.2 var(--f-display);pointer-events:none}
@media (max-width:560px){.setgrid{grid-template-columns:minmax(0,1fr)}}
.view.drawing .hint{bottom:auto;top:98px}

'help.title':'Návod ke Stage Lab',
'help.html':`<p>Stage Lab je editor 3D vizualizací pódií a světel. Každý projekt má prostor (půdorys, výšku a povrchy), prvky (světla, konstrukce, zvuk, lidi), uložené pohledy, fotky a videa. Všechno se ukládá samo při každé změně.</p>
<details open><summary>První kroky</summary><ul>
<li>Projekt otevřeš, založíš ze šablony nebo zkopíruješ klepnutím na jeho název vlevo nahoře.</li>
<li>Přepínačem <b>3D / Půdorys</b> měníš zobrazení. Klávesa <kbd>P</kbd> přepíná také.</li>
<li>Panel má záložky <b>Přidat, Prvky, Upravit, Prostor, Scéna a Fotky</b>. Na mobilu ho tažením za úchyt zvětšíš nebo sbalíš.</li>
<li>Jazyk, chování myši a přichytávání změníš v <b>Nastavení</b> (ozubené kolečko nahoře).</li></ul></details>
<details open><summary>Pohyb ve 3D</summary><div class="tw"><table class="ktab"><tr><th>Co</th><th>Myš a klávesnice</th><th>Dotyk</th></tr>
<tr><td>Otáčet kolem</td><td>Levé tlačítko a táhnout. Otáčí se kolem místa, na které míříš.</td><td>Jeden prst</td></tr>
<tr><td>Dopředu, dozadu, do stran</td><td>Pravé tlačítko a táhnout</td><td>Dva prsty</td></tr>
<tr><td>Nahoru a dolů</td><td><kbd>Shift</kbd> a pravé tlačítko, nebo <kbd>Q</kbd> a <kbd>E</kbd></td><td>Dva prsty</td></tr>
<tr><td>Přiblížit</td><td>Kolečko, přibližuje k místu pod kurzorem</td><td>Roztáhnout prsty</td></tr>
<tr><td>Přeletět na místo</td><td>Dvojklik</td><td>Dvojité klepnutí</td></tr>
<tr><td>Chodit</td><td><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>, se <kbd>Shift</kbd> rychleji</td><td>Režim Chodit a kroužek vlevo dole</td></tr>
</table></div><p>Pokud chceš, aby pravé tlačítko posouvalo pohled nahoru a dolů jako v jiných programech, přepni to v Nastavení.</p></details>
<details open><summary>Posouvání, otáčení a velikost</summary><ul>
<li>Po výběru prvku se ve 3D ukáže <b>gizmo</b>. Tažením barevné šipky posouváš v jednom směru, čtverečkem v rovině. Tlačítka <b>Posun, Otočit, Velikost</b> nad scénou (nebo <kbd>M</kbd>, <kbd>R</kbd>, <kbd>T</kbd>) přepínají režim.</li>
<li>Vybraný prvek můžeš i chytit a táhnout po podlaze.</li>
<li><b>Šipky</b> posouvají výběr o 10 cm, se <kbd>Shift</kbd> o 50 cm, s <kbd>Alt</kbd> o 1 cm. <kbd>PageUp</kbd> a <kbd>PageDown</kbd> mění výšku, <kbd>[</kbd> a <kbd>]</kbd> otáčejí o 15°.</li>
<li>V půdorysu táhneš prvek přímo, oranžovým kruhem otáčíš a <b>čtverečky na hranách měníš rozměr</b>, druhá hrana zůstane na místě.</li>
<li>Všechno se přichytává na 5 cm a 15°. Kroky změníš v Nastavení, během tažení je vypne <kbd>Alt</kbd>.</li></ul></details>
<details><summary>Stěny po metrech</summary><ul>
<li>V záložce <b>Prostor</b> klikni na <b>Nakreslit místnost</b>. Klikni na první roh, potom napiš délku stěny v metrech a stiskni <kbd>Enter</kbd>. Směr určuje kurzor a přichytává se po 15°.</li>
<li>Na mobilu zadáš délku a směr v okénku dole a klepneš na Přidat stěnu.</li>
<li>Kliknutím na první bod nebo tlačítkem Uzavřít je místnost hotová. <kbd>Backspace</kbd> vrátí poslední bod.</li>
<li><b>Kreslit příčky</b> funguje stejně, ale vytvoří samostatné stěny uvnitř místnosti.</li>
<li>Tabulka stěn ukazuje délku a zatočení každé stěny. Přepiš číslo a půdorys se přepočítá.</li></ul></details>
<details><summary>Podkladová fotka půdorysu</summary><ul>
<li>V Prostoru u <b>Podkladové fotky</b> nahraj fotku nebo nákres půdorysu.</li>
<li><b>Nastavit měřítko</b>: klikni na dva body, jejichž skutečnou vzdálenost znáš, a zadej ji v metrech.</li>
<li><b>Posunout fotku</b> ji dá na správné místo, potom ji obkresli přes Nakreslit místnost.</li></ul></details>
<details><summary>Knihovna a přidávání</summary><ul>
<li>Záložka <b>Přidat</b> má vyhledávání a kategorie: světla, pohyblivé hlavy, efekty, konstrukce, zvuk, nábytek, lidé a vlastní modely.</li>
<li>Nastav Počet kusů, Rozestup a Uspořádání a klepni na prvek. Víc kusů se rozloží samo a spojí do skupiny.</li>
<li><b>Vlastní 3D modely</b> nahraješ jako GLB nebo glTF (i přetažením do okna). Bezplatné najdeš na Poly Pizza, Kenney nebo Sketchfab.</li></ul></details>
<details><summary>Světla</summary><ul>
<li>Směr světla určuje <b>Natočení</b> a <b>Sklon</b>, nebo gizmo Otočit. Vybrané světlo ukazuje směr šipkou a paprskem.</li>
<li><b>Pohyblivé hlavy</b> mají Pan a Tilt a automatický pohyb (kruh, osmička, zleva doprava). Posun pohybu u více hlav vytvoří vlnu.</li>
<li><b>Stroboskop</b> má režim, frekvenci, délku záblesku a rozptyl. <b>Laser</b> a paprsky jsou vidět jen v mlze.</li>
<li>Efekt <b>Podle scény</b> bere efekt a tempo ze záložky Scéna. U více vybraných světel vytvoříš vlnu jedním tlačítkem.</li>
<li>Najednou se počítá 32 nejdůležitějších světel. Ostatní se dočasně vypnou, dokud se k nim nepřiblížíš.</li></ul></details>
<details><summary>Výběr více, zarovnání a skupiny</summary><ul>
<li><kbd>Shift</kbd> nebo <kbd>Ctrl</kbd> a klik přidá nebo odebere prvek z výběru. Na mobilu zapni <b>Vybírat víc</b>.</li>
<li><b>Zarovnat</b> a <b>Rozložit rovnoměrně</b> fungují jako v Tinkercadu. Skupina se zarovná jako celek.</li>
<li><b>Seskupit</b> spojí výběr, klepnutím na kterýkoli prvek vybereš celou skupinu.</li>
<li><b>Rozmnožit</b> vytvoří kopie s krokem do strany, po délce a otočením.</li></ul></details>
<details><summary>Taneční HAKY za DJ-em</summary><ul>
<li>Vyber DJ HAKY a tlačítky <b>+</b> a <b>−</b> nastav počet tanečních HAKY.</li>
<li>Při změně se celý stage posune tak, aby zůstal stejný odstup od zadní stěny.</li></ul></details>
<details><summary>Video</summary><ul>
<li><b>Průlet pohledů</b> proletí kamerou přes uložené pohledy, u každého kroku nastavíš čas, oběh a zobrazení.</li>
<li><b>Nahrávat volně</b> nahraje všechno, co ve 3D děláš, dokud nestiskneš Zastavit nebo <kbd>Esc</kbd>.</li></ul></details>
<details><summary>Klávesové zkratky</summary><div class="tw"><table class="ktab">
<tr><td><kbd>Ctrl</kbd> <kbd>Z</kbd></td><td>Zpět</td></tr><tr><td><kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>Z</kbd></td><td>Znovu</td></tr>
<tr><td><kbd>Delete</kbd></td><td>Smazat výběr</td></tr><tr><td><kbd>Ctrl</kbd> <kbd>D</kbd></td><td>Duplikovat</td></tr>
<tr><td><kbd>Ctrl</kbd> <kbd>G</kbd></td><td>Seskupit, se <kbd>Shift</kbd> rozdělit</td></tr><tr><td><kbd>Ctrl</kbd> <kbd>A</kbd></td><td>Vybrat vše</td></tr>
<tr><td><kbd>M</kbd> <kbd>R</kbd> <kbd>T</kbd></td><td>Gizmo: posun, otočení, velikost</td></tr><tr><td>Šipky, <kbd>PageUp</kbd>, <kbd>PageDown</kbd></td><td>Posun výběru</td></tr>
<tr><td><kbd>[</kbd> <kbd>]</kbd></td><td>Otočit výběr</td></tr><tr><td><kbd>F</kbd></td><td>Najít vybrané</td></tr>
<tr><td><kbd>P</kbd></td><td>3D nebo půdorys</td></tr><tr><td><kbd>Esc</kbd></td><td>Zrušit výběr nebo ukončit kreslení</td></tr><tr><td><kbd>?</kbd></td><td>Tento návod</td></tr></table></div></details>
<details><summary>Ukládání a projekty</summary><ul>
<li>V Claude se projekty ukládají k aplikaci. Na GitHub Pages nebo jako soubor se ukládají v prohlížeči.</li>
<li><b>Exportovat projekt</b> uloží soubor i s fotkami a modely, <b>Importovat</b> ho otevře na jiném počítači.</li></ul></details>`

'help.title':'Stage Lab guide',
'help.html':`<p>Stage Lab is a 3D editor for stage and lighting visualisations. Each project has a room (plan, height and surfaces), items (lights, structures, sound, people), saved views, photos and videos. Everything saves automatically on every change.</p>
<details open><summary>Getting started</summary><ul>
<li>Open a project, create one from a template or copy it by tapping its name at the top left.</li>
<li>The <b>3D / Floor plan</b> switch changes the view. The <kbd>P</kbd> key toggles it too.</li>
<li>The panel has the tabs <b>Add, Items, Edit, Room, Scene and Photos</b>. On mobile drag its handle to expand or collapse it.</li>
<li>Change the language, mouse behaviour and snapping in <b>Settings</b> (the gear at the top).</li></ul></details>
<details open><summary>Moving in 3D</summary><div class="tw"><table class="ktab"><tr><th>What</th><th>Mouse and keyboard</th><th>Touch</th></tr>
<tr><td>Orbit</td><td>Drag with the left button. It orbits around the point you aim at.</td><td>One finger</td></tr>
<tr><td>Forward, back, sideways</td><td>Drag with the right button</td><td>Two fingers</td></tr>
<tr><td>Up and down</td><td><kbd>Shift</kbd> and right button, or <kbd>Q</kbd> and <kbd>E</kbd></td><td>Two fingers</td></tr>
<tr><td>Zoom</td><td>Wheel, zooms to the point under the cursor</td><td>Pinch</td></tr>
<tr><td>Fly to a spot</td><td>Double click</td><td>Double tap</td></tr>
<tr><td>Walk</td><td><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>, faster with <kbd>Shift</kbd></td><td>Walk mode and the circle at bottom left</td></tr>
</table></div><p>If you want the right button to pan the view up and down like in other programs, switch it in Settings.</p></details>
<details open><summary>Moving, rotating and resizing</summary><ul>
<li>When an item is selected, a <b>gizmo</b> appears in 3D. Drag a coloured arrow to move along one axis, a square to move in a plane. The <b>Move, Rotate, Size</b> buttons above the scene (or <kbd>M</kbd>, <kbd>R</kbd>, <kbd>T</kbd>) switch the mode.</li>
<li>You can also grab the selected item and drag it along the floor.</li>
<li><b>Arrow keys</b> move the selection by 10 cm, 50 cm with <kbd>Shift</kbd>, 1 cm with <kbd>Alt</kbd>. <kbd>PageUp</kbd> and <kbd>PageDown</kbd> change height, <kbd>[</kbd> and <kbd>]</kbd> rotate by 15°.</li>
<li>On the floor plan drag an item directly, rotate it with the orange circle and <b>resize it with the squares on its edges</b>, the opposite edge stays put.</li>
<li>Everything snaps to 5 cm and 15°. Change the steps in Settings, hold <kbd>Alt</kbd> while dragging to turn snapping off.</li></ul></details>
<details><summary>Walls by metres</summary><ul>
<li>In the <b>Room</b> tab click <b>Draw room</b>. Click the first corner, then type the wall length in metres and press <kbd>Enter</kbd>. The cursor sets the direction, snapping to 15°.</li>
<li>On mobile type the length and direction in the box at the bottom and tap Add wall.</li>
<li>Click the first point or Close to finish the room. <kbd>Backspace</kbd> removes the last point.</li>
<li><b>Draw partitions</b> works the same way but creates separate walls inside the room.</li>
<li>The wall table shows the length and turn of every wall. Type a new number and the plan updates.</li></ul></details>
<details><summary>Floor plan backdrop</summary><ul>
<li>In Room, under <b>Backdrop photo</b>, upload a photo or drawing of the plan.</li>
<li><b>Set scale</b>: click two points whose real distance you know and type it in metres.</li>
<li><b>Move photo</b> puts it in place, then trace it with Draw room.</li></ul></details>
<details><summary>Library and adding</summary><ul>
<li>The <b>Add</b> tab has search and categories: lights, moving heads, effects, structures, sound, furniture, people and custom models.</li>
<li>Set Quantity, Spacing and Layout, then tap an item. Several pieces are laid out and grouped automatically.</li>
<li>Upload <b>custom 3D models</b> as GLB or glTF (or drag them into the window). Free ones are on Poly Pizza, Kenney or Sketchfab.</li></ul></details>
<details><summary>Lights</summary><ul>
<li>Light direction comes from <b>Pan</b> and <b>Tilt</b>, or the Rotate gizmo. A selected light shows its direction with an arrow and beam.</li>
<li><b>Moving heads</b> have Pan, Tilt and automatic movement (circle, figure eight, left to right). Movement offset across several heads makes a wave.</li>
<li>The <b>strobe</b> has mode, rate, flash length and spread. <b>Lasers</b> and beams are only visible in haze.</li>
<li>The <b>Scene effect</b> takes its effect and tempo from the Scene tab. With several lights selected you can make a wave with one button.</li>
<li>The 32 most important lights are rendered at once. The rest switch off until you get closer.</li></ul></details>
<details><summary>Multi-select, align and groups</summary><ul>
<li><kbd>Shift</kbd> or <kbd>Ctrl</kbd> click adds or removes an item. On mobile turn on <b>Multi-select</b>.</li>
<li><b>Align</b> and <b>Distribute evenly</b> work like in Tinkercad. A group aligns as a whole.</li>
<li><b>Group</b> joins the selection, tapping any item selects the whole group.</li>
<li><b>Array</b> creates copies with a step sideways, lengthwise and in rotation.</li></ul></details>
<details><summary>Dance HAKY behind the DJ</summary><ul>
<li>Select the DJ HAKY and set the number of dance HAKY with <b>+</b> and <b>−</b>.</li>
<li>When it changes, the whole stage shifts to keep the same distance from the back wall.</li></ul></details>
<details><summary>Video</summary><ul>
<li><b>Fly-through</b> moves the camera through saved views, with hold time, orbit and display for each step.</li>
<li><b>Free recording</b> records everything you do in 3D until you press Stop or <kbd>Esc</kbd>.</li></ul></details>
<details><summary>Keyboard shortcuts</summary><div class="tw"><table class="ktab">
<tr><td><kbd>Ctrl</kbd> <kbd>Z</kbd></td><td>Undo</td></tr><tr><td><kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>Z</kbd></td><td>Redo</td></tr>
<tr><td><kbd>Delete</kbd></td><td>Delete selection</td></tr><tr><td><kbd>Ctrl</kbd> <kbd>D</kbd></td><td>Duplicate</td></tr>
<tr><td><kbd>Ctrl</kbd> <kbd>G</kbd></td><td>Group, with <kbd>Shift</kbd> ungroup</td></tr><tr><td><kbd>Ctrl</kbd> <kbd>A</kbd></td><td>Select all</td></tr>
<tr><td><kbd>M</kbd> <kbd>R</kbd> <kbd>T</kbd></td><td>Gizmo: move, rotate, size</td></tr><tr><td>Arrows, <kbd>PageUp</kbd>, <kbd>PageDown</kbd></td><td>Move selection</td></tr>
<tr><td><kbd>[</kbd> <kbd>]</kbd></td><td>Rotate selection</td></tr><tr><td><kbd>F</kbd></td><td>Find selection</td></tr>
<tr><td><kbd>P</kbd></td><td>3D or floor plan</td></tr><tr><td><kbd>Esc</kbd></td><td>Deselect or stop drawing</td></tr><tr><td><kbd>?</kbd></td><td>This guide</td></tr></table></div></details>
<details><summary>Saving and projects</summary><ul>
<li>In Claude, projects are saved with the app. On GitHub Pages or as a file they are saved in the browser.</li>
<li><b>Export project</b> saves a file including photos and models, <b>Import</b> opens it on another computer.</li></ul></details>`
};

'help.html':`<p>Stage Lab je editor 3D vizualizácií stageov a svetiel. Každý projekt má priestor (pôdorys, výšku a povrchy), prvky (svetlá, konštrukcie, zvuk, ľudí), uložené pohľady, fotky a videá. Všetko sa ukladá samo pri každej zmene.</p>
<details open><summary>Prvé kroky</summary><ul>
<li>Projekt otvoríš, založíš zo šablóny alebo skopíruješ ťuknutím na jeho názov vľavo hore.</li>
<li>Prepínačom <b>3D / Pôdorys</b> meníš zobrazenie. Klávesa <kbd>P</kbd> prepína tiež.</li>
<li>Panel má záložky <b>Pridať, Prvky, Upraviť, Priestor, Scéna a Fotky</b>. Na mobile ho ťahaním za úchyt zväčšíš alebo zbalíš.</li>
<li>Jazyk, správanie myši a prichytávanie zmeníš v <b>Nastaveniach</b> (ozubené koliesko hore).</li></ul></details>
<details open><summary>Pohyb v 3D</summary><div class="tw"><table class="ktab"><tr><th>Čo</th><th>Myš a klávesnica</th><th>Dotyk</th></tr>
<tr><td>Otáčať okolo</td><td>Ľavé tlačidlo a ťahať. Otáča sa okolo miesta, na ktoré mieriš.</td><td>Jeden prst</td></tr>
<tr><td>Dopredu, dozadu, do strán</td><td>Pravé tlačidlo a ťahať</td><td>Dva prsty</td></tr>
<tr><td>Hore a dole</td><td><kbd>Shift</kbd> a pravé tlačidlo, alebo <kbd>Q</kbd> a <kbd>E</kbd></td><td>Dva prsty</td></tr>
<tr><td>Priblížiť</td><td>Koliesko, približuje k miestu pod kurzorom</td><td>Roztiahnuť prsty</td></tr>
<tr><td>Preletieť na miesto</td><td>Dvojklik</td><td>Dvojité ťuknutie</td></tr>
<tr><td>Chodiť</td><td><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>, so <kbd>Shift</kbd> rýchlejšie</td><td>Režim Chodiť a krúžok vľavo dole</td></tr>
</table></div><p>Ak chceš, aby pravé tlačidlo posúvalo pohľad hore a dole ako v iných programoch, prepni to v Nastaveniach.</p></details>
<details open><summary>Posúvanie, otáčanie a veľkosť</summary><ul>
<li>Po výbere prvku sa v 3D ukáže <b>gizmo</b>. Ťahaním farebnej šípky posúvaš v jednom smere, štvorčekom v rovine. Tlačidlá <b>Posun, Otočiť, Veľkosť</b> nad scénou (alebo <kbd>M</kbd>, <kbd>R</kbd>, <kbd>T</kbd>) prepínajú režim.</li>
<li>Vybraný prvok môžeš aj chytiť a ťahať po podlahe.</li>
<li><b>Šípky</b> posúvajú výber o 10 cm, so <kbd>Shift</kbd> o 50 cm, s <kbd>Alt</kbd> o 1 cm. <kbd>PageUp</kbd> a <kbd>PageDown</kbd> menia výšku, <kbd>[</kbd> a <kbd>]</kbd> otáčajú o 15°.</li>
<li>V pôdoryse ťaháš prvok priamo, oranžovým kruhom otáčaš a <b>štvorčekmi na hranách meníš rozmer</b>, druhá hrana ostane na mieste.</li>
<li>Všetko sa prichytáva na 5 cm a 15°. Kroky zmeníš v Nastaveniach, počas ťahania ich vypne <kbd>Alt</kbd>.</li></ul></details>
<details><summary>Steny po metroch</summary><ul>
<li>V záložke <b>Priestor</b> klikni na <b>Nakresliť miestnosť</b>. Klikni na prvý roh, potom napíš dĺžku steny v metroch a stlač <kbd>Enter</kbd>. Smer určuje kurzor a prichytáva sa po 15°.</li>
<li>Na mobile zadáš dĺžku a smer v okienku dole a ťukneš na Pridať stenu.</li>
<li>Kliknutím na prvý bod alebo tlačidlom Uzavrieť je miestnosť hotová. <kbd>Backspace</kbd> vráti posledný bod.</li>
<li><b>Kresliť priečky</b> funguje rovnako, ale vytvorí samostatné steny vnútri miestnosti.</li>
<li>Tabuľka stien ukazuje dĺžku a zatočenie každej steny. Prepíš číslo a pôdorys sa prepočíta.</li></ul></details>
<details><summary>Podkladová fotka pôdorysu</summary><ul>
<li>V Priestore pri <b>Podkladovej fotke</b> nahraj fotku alebo nákres pôdorysu.</li>
<li><b>Nastaviť mierku</b>: klikni na dva body, ktorých skutočnú vzdialenosť poznáš, a zadaj ju v metroch.</li>
<li><b>Posunúť fotku</b> ju dá na správne miesto, potom ju obkresli cez Nakresliť miestnosť.</li></ul></details>
<details><summary>Knižnica a pridávanie</summary><ul>
<li>Záložka <b>Pridať</b> má vyhľadávanie a kategórie: svetlá, pohyblivé hlavy, efekty, konštrukcie, zvuk, nábytok, ľudia a vlastné modely.</li>
<li>Nastav Počet kusov, Rozostup a Usporiadanie a ťukni na prvok. Viac kusov sa rozloží samo a spojí do skupiny.</li>
<li><b>Vlastné 3D modely</b> nahráš ako GLB alebo glTF (aj pretiahnutím do okna). Bezplatné nájdeš na Poly Pizza, Kenney alebo Sketchfab.</li></ul></details>
<details><summary>Svetlá</summary><ul>
<li>Smer svetla určuje <b>Natočenie</b> a <b>Sklon</b>, alebo gizmo Otočiť. Vybrané svetlo ukazuje smer šípkou a lúčom.</li>
<li><b>Pohyblivé hlavy</b> majú Pan a Tilt a automatický pohyb (kruh, osmička, zľava doprava). Posun pohybu pri viacerých hlavách vytvorí vlnu.</li>
<li><b>Stroboskop</b> má režim, frekvenciu, dĺžku záblesku a rozptyl. <b>Laser</b> a lúče vidno len v hmle.</li>
<li>Efekt <b>Podľa scény</b> berie efekt a tempo zo záložky Scéna. Pri viacerých vybraných svetlách vytvoríš vlnu jedným tlačidlom.</li>
<li>Naraz sa počíta 32 najdôležitejších svetiel. Ostatné sa dočasne vypnú, kým sa k nim nepriblížiš.</li></ul></details>
<details><summary>Výber viacerých, zarovnanie a skupiny</summary><ul>
<li><kbd>Shift</kbd> alebo <kbd>Ctrl</kbd> a klik pridá alebo odoberie prvok z výberu. Na mobile zapni <b>Vyberať viac</b>.</li>
<li><b>Zarovnať</b> a <b>Rozložiť rovnomerne</b> fungujú ako v Tinkercade. Skupina sa zarovná ako celok.</li>
<li><b>Zoskupiť</b> spojí výber, ťuknutím na ktorýkoľvek prvok vyberieš celú skupinu.</li>
<li><b>Rozmnožiť</b> vytvorí kópie s krokom do strany, po dĺžke a otočením.</li></ul></details>
<details><summary>Tanečné HAKY za DJ-om</summary><ul>
<li>Vyber DJ HAKY a tlačidlami <b>+</b> a <b>−</b> nastav počet tanečných HAKY.</li>
<li>Pri zmene sa celý stage posunie tak, aby ostal rovnaký odstup od zadnej steny.</li></ul></details>
<details><summary>Video</summary><ul>
<li><b>Prelet pohľadov</b> preletí kamerou cez uložené pohľady, pri každom kroku nastavíš čas, obeh a zobrazenie.</li>
<li><b>Nahrávať voľne</b> nahrá všetko, čo v 3D robíš, kým nestlačíš Zastaviť alebo <kbd>Esc</kbd>.</li></ul></details>
<details><summary>Klávesové skratky</summary><div class="tw"><table class="ktab">
<tr><td><kbd>Ctrl</kbd> <kbd>Z</kbd></td><td>Späť</td></tr><tr><td><kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>Z</kbd></td><td>Znova</td></tr>
<tr><td><kbd>Delete</kbd></td><td>Zmazať výber</td></tr><tr><td><kbd>Ctrl</kbd> <kbd>D</kbd></td><td>Duplikovať</td></tr>

/* =========================================================
   Ukladanie
   V Claude: databáza (db) a súbory (assets) aplikácie.
   Samostatne (GitHub Pages, súbor): IndexedDB v prehliadači.
   ========================================================= */
let db=null,assets=null,downloads=null,storeMode='local';
const inClaude=()=>!!(window.claude&&typeof window.claude.use==='function');
const IDB={h:null};
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('stagelab',1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs');};
  r.onsuccess=()=>{IDB.h=r.result;res(r.result);};r.onerror=()=>res(null);}catch(e){res(null);}});}
function idb(store,mode,fn){return new Promise((res,rej)=>{if(!IDB.h)return rej(new Error('no-idb'));let out;try{const tx=IDB.h.transaction(store,mode);const req=fn(tx.objectStore(store));
  tx.oncomplete=()=>res(req?req.result:out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);}catch(e){rej(e);}});}

const LS_KEY='stagelab-projects-v1';
async function migrateLocal(){const all=lsGet(LS_KEY);if(!all||!IDB.h)return;try{for(const p of Object.values(all))await idb('projects','readwrite',s=>s.put(p));localStorage.removeItem(LS_KEY);}catch(e){}}

async function listProjects(){
  if(db){try{const s=await db.collection('projects').orderBy('updated','desc').get();return s.docs.map(d=>({id:d.id,name:d.data().name,updated:d.data().updated}));}catch(e){}}
  if(IDB.h){try{const all=await idb('projects','readonly',s=>s.getAll());return all.map(p=>({id:p.id,name:p.name,updated:p.updated})).sort((a,b)=>b.updated-a.updated);}catch(e){}}
  const all=lsGet(LS_KEY)||{};return Object.values(all).map(p=>({id:p.id,name:p.name,updated:p.updated})).sort((a,b)=>b.updated-a.updated);
}
async function loadProject(id){
  if(db){try{const d=await db.doc('projects/'+id).get();if(d.exists)return JSON.parse(d.data().json);}catch(e){}}
  if(IDB.h){try{const p=await idb('projects','readonly',s=>s.get(id));if(p)return JSON.parse(JSON.stringify(p));}catch(e){}}
  const all=lsGet(LS_KEY)||{};return all[id]?JSON.parse(JSON.stringify(all[id])):null;
}
async function writeProject(p){
  const json=JSON.stringify(p);
  if(db){try{await db.doc('projects/'+p.id).set({name:p.name,updated:p.updated,json});return 'db';}catch(e){if(json.length>250000)toast(t('save.tooBig'));}}
  if(IDB.h){try{await idb('projects','readwrite',s=>s.put(JSON.parse(json)));return 'local';}catch(e){}}
  const all=lsGet(LS_KEY)||{};all[p.id]=p;return lsSet(LS_KEY,all)?'local':'fail';
}
async function deleteProject(id){
  if(db){try{await db.doc('projects/'+id).delete();}catch(e){}}
  if(IDB.h){try{await idb('projects','readwrite',s=>s.delete(id));}catch(e){}}
  const all=lsGet(LS_KEY);if(all&&all[id]){delete all[id];lsSet(LS_KEY,all);}
}

/* súbory: odkaz {asset} v Claude, {blob} v IndexedDB, {data} ako záloha */
const blobUrls={};
async function storeBlob(blob,type){
  if(assets){try{const r=await assets.upload(blob,type?{type}:undefined);return{asset:r.id};}catch(e){}}
  if(IDB.h){try{const key=uid()+uid();await idb('blobs','readwrite',s=>s.put(blob,key));blobUrls[key]=URL.createObjectURL(blob);return{blob:key};}catch(e){}}
  const data=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob);});return{data};
}
function refUrl(r){if(!r)return null;if(r.asset)return'/_blob/'+r.asset;if(r.blob)return blobUrls[r.blob]||null;return r.data||null;}
async function refBlob(r){if(r&&r.blob&&IDB.h){try{const b=await idb('blobs','readonly',s=>s.get(r.blob));if(b)return b;}catch(e){}}const u=refUrl(r);if(!u)return null;return await (await fetch(u)).blob();}
async function deleteRef(r){if(!r)return;if(r.asset&&assets){try{await assets.delete(r.asset);}catch(e){}}if(r.blob&&IDB.h){try{await idb('blobs','readwrite',s=>s.delete(r.blob));}catch(e){}if(blobUrls[r.blob]){URL.revokeObjectURL(blobUrls[r.blob]);delete blobUrls[r.blob];}}}
async function preloadBlobs(p){if(!IDB.h)return;const refs=[...(p.photos||[]),...(p.videos||[]),...(p.models||[])].filter(r=>r.blob&&!blobUrls[r.blob]);
  for(const r of refs){try{const b=await idb('blobs','readonly',s=>s.get(r.blob));if(b)blobUrls[r.blob]=URL.createObjectURL(b);}catch(e){}}}
const photoUrl=ph=>refUrl(ph);

/* stiahnutie súboru */
async function getDownloads(){if(downloads)return downloads;try{if(inClaude())downloads=await window.claude.use('downloads');}catch(e){}return downloads;}
async function offerFile(blob,filename,opt){opt=opt||{};
  if(!inClaude()){const u=URL.createObjectURL(blob);const a=el('a',{href:u,download:filename});document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u);},4000);return;}
  const dl=await getDownloads();
  if(dl){try{await dl.save({filename,data:blob});return;}catch(e){if(e&&e.code==='cancelled')return;if(e&&!['unavailable','not_granted'].includes(e.code)){toast(t('dl.failed'));return;}}}
  let url=opt.url||null;
  if(!url&&assets){try{toast(t('dl.preparing'));const r=await assets.upload(blob,blob.type?{type:blob.type}:undefined);url=r.url;opt.onUploaded&&opt.onUploaded(r);}catch(e){}}
  if(!url){toast(t('dl.unavailable'));return;}
  const box=modalBox(t('dl.title'));modalHead(box,t('dl.title'));
  box.appendChild(el('p',{class:'sub',text:t('dl.linkInfo')}));
  const a=el('a',{href:url,target:'_blank',rel:'noopener',class:'chip acc',text:t('dl.open',{name:filename})});a.style.textDecoration='none';a.style.maxWidth='100%';a.style.overflow='hidden';
  box.appendChild(el('div',{class:'actions'},[a]));
}

/* ---------- svetelný engine: jeden zásobník svetiel pre všetky materiály ---------- */
const MAXL=32;
const LU={uLP:{value:Array.from({length:MAXL},()=>new V4())},uLD:{value:Array.from({length:MAXL},()=>new V4())},
  uLC:{value:Array.from({length:MAXL},()=>new V4())},uLB:{value:Array.from({length:MAXL},()=>new V4())},
  uN:{value:0},uAmb:{value:new V3(0.1,0.1,0.1)},uExp:{value:1.15},uDiscoRot:{value:0}};
const LIGHT_GLSL=`
uniform vec4 uLP[${MAXL}]; uniform vec4 uLD[${MAXL}]; uniform vec4 uLC[${MAXL}]; uniform vec4 uLB[${MAXL}];
uniform float uN; uniform vec3 uAmb; uniform float uExp; uniform float uDiscoRot;
float sqD(vec2 p, vec2 c, float h, float a){ vec2 q=p-c; float cs=cos(a), sn=sin(a); q=vec2(cs*q.x-sn*q.y, sn*q.x+cs*q.y); q=abs(q)-vec2(h); return abs(length(max(q,0.0))+min(max(q.x,q.y),0.0)); }
vec3 lightAt(vec3 wp, vec3 n, float trans){
  vec3 L=uAmb;
  for(int i=0;i<${MAXL};i++){
    if(float(i)>=uN) break;
    vec4 P=uLP[i]; vec4 D=uLD[i]; vec4 C=uLC[i]; vec4 B=uLB[i];
    float kind=P.w;
    if(kind>3.5){
      float dr=sqD(wp.xz,P.xz,B.x,B.y); float dy=abs(P.y-wp.y);
      L+=C.rgb*(1.0/(1.0+(dr*dr+dy*dy)*4.0))*(0.35+0.65*abs(n.y))+C.rgb*exp(-dr*dr*30.0)*smoothstep(0.6,0.0,dy)*1.4;
      continue;
    }
    vec3 lp=P.xyz;
    if(kind>1.5&&kind<2.5){ vec3 ab=B.xyz-P.xyz; float tt=clamp(dot(wp-P.xyz,ab)/max(dot(ab,ab),1e-4),0.0,1.0); lp=P.xyz+ab*tt; }
    vec3 lv=lp-wp; float d=length(lv); vec3 l=lv/max(d,1e-4);
    float att=pow(clamp(1.0-d/C.a,0.0,1.0),2.0);
    float cone=1.0;
    if(D.w>-1.5){ float c=dot(-l,D.xyz); cone=smoothstep(D.w,mix(D.w,1.0,0.3),c); if(trans>0.5) cone=max(cone,0.9*smoothstep(D.w-0.75,D.w,c)); }
    float nd=dot(n,l);
    float ndl=trans>0.5?abs(nd):max(nd,0.0)*0.85+0.15*clamp(nd+0.6,0.0,1.0);
    if(kind>2.5){
      vec3 dv=normalize(wp-P.xyz); float az=atan(dv.z,dv.x)+uDiscoRot; float el=asin(clamp(dv.y,-1.0,1.0));
      vec2 g=vec2(az*10.0,el*10.0); vec2 id=floor(g); vec2 f=fract(g)-0.5;
      float hs=fract(sin(dot(id,vec2(12.9898,78.233)))*43758.5453);
      cone=(1.0-smoothstep(0.07,0.16,length(f)))*step(0.5,hs)*3.0; ndl=1.0;
    }
    L+=C.rgb*att*cone*ndl;
  }
  return L;
}
vec3 tone(vec3 c){ return vec3(1.0)-exp(-c*uExp*1.35); }`;
const VS=`varying vec3 vW; varying vec3 vN; varying vec2 vUv;
#include <fog_pars_vertex>
void main(){ vUv=uv; vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; vN=normalize(mat3(modelMatrix)*normal); vec4 mvPosition=viewMatrix*w; gl_Position=projectionMatrix*mvPosition;
#include <fog_vertex>
}`;
const FS=`uniform vec3 uColor; uniform sampler2D uMap; uniform float uHasMap; uniform vec2 uRep; uniform vec3 uEmis; uniform float uTrans; uniform float uPlastic; uniform float uOpacity; uniform float uAlphaTest; uniform float uWork;
varying vec3 vW; varying vec3 vN; varying vec2 vUv;
${LIGHT_GLSL}
#include <fog_pars_fragment>
void main(){
  vec4 tx=uHasMap>0.5?texture2D(uMap,vUv*uRep):vec4(1.0);
  if(uAlphaTest>0.0&&tx.a<uAlphaTest) discard;
  vec3 base=uColor*tx.rgb;
  vec3 n=normalize(vN); if(!gl_FrontFacing) n=-n;
  vec3 L=lightAt(vW,n,uTrans);
  vec3 c; float a=uOpacity;
  if(uPlastic>0.5){
    float f1=sin(vUv.x*7.3+sin(vUv.y*2.1+vUv.x*0.9)*2.2); float f2=sin(vUv.x*23.0+vUv.y*3.0+sin(vUv.x*3.1)*3.0);
    float fold=0.5+0.35*f1+0.15*f2; float lum=dot(L-uAmb,vec3(0.3,0.5,0.2));
    c=L*(0.45+fold*0.85)+vec3(pow(max(f1,0.0),14.0))*(0.03+lum*0.5);
    a=clamp(0.12+lum*0.9,0.0,0.93)*uOpacity; a=mix(a,0.45,uWork);
  } else { c=base*L; }
  c=tone(c)+uEmis;
  gl_FragColor=vec4(c,a);
#include <fog_fragment>
}`;
const workU={value:0};
function mkMat(o){o=o||{};
  const u=Object.assign(THREE.UniformsUtils.clone(THREE.UniformsLib.fog),{uColor:{value:new THREE.Color(o.color||'#888888')},uMap:{value:o.map||dummyTex},uHasMap:{value:o.map?1:0},uRep:{value:new V2(o.rep||1,o.rep||1)},
    uEmis:{value:new THREE.Color(o.emis||0x000000)},uTrans:{value:o.trans?1:0},uPlastic:{value:o.plastic?1:0},uOpacity:{value:o.opacity==null?1:o.opacity},uAlphaTest:{value:o.alphaTest||0}});
  Object.assign(u,LU);u.uWork=workU;
  return new THREE.ShaderMaterial({uniforms:u,vertexShader:VS,fragmentShader:FS,fog:true,side:o.front?THREE.FrontSide:THREE.DoubleSide,transparent:!!o.plastic||(o.opacity!=null&&o.opacity<1),depthWrite:!o.plastic});}

/* =========================================================
   Stav aplikácie a priestor (pôdorys -> podlaha, steny, strop)
   ========================================================= */
let P=null;              // aktuálny projekt
let sel=null;            // hlavný vybraný prvok
let selSet=new Set();    // všetky vybrané prvky
let multiMode=false;
let hist=[],hi=-1;
let mode='3d',nav='orbit',tab='add',roomEdit=false,roomPrevMode='3d',selPhoto=null,overlayPhoto=null;

const roomGroup=new THREE.Group(),objRoot=new THREE.Group();scene.add(roomGroup,objRoot);
const objMap=new Map();
let walls=[];
let planDirty=true;

function surfMat(tx){
  const ph=tx.p==='photo'&&tx.img?P.photos.find(x=>x.id===tx.img):null;
  const map=ph?photoTex(photoUrl(ph)):presetTex(tx.p==='photo'?'omietka':tx.p);
  return mkMat({map,rep:1/(tx.s||2),color:tx.tint||'#ffffff'});
}
function polyArea(pts){let a=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];a+=p[0]*q[1]-q[0]*p[1];}return a/2;}
function buildRoom(){
  while(roomGroup.children.length){const c=roomGroup.children.pop();c.geometry&&c.geometry.dispose();}
  walls=[];
  const R=P.room,pts=R.pts,h=R.h;
  if(pts.length<3)return;
  const fl=new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(pts.map(p=>new V2(p[0],-p[1])))),surfMat(R.tex.floor));fl.rotation.x=-Math.PI/2;fl.userData.surface='floor';roomGroup.add(fl);
  const ce=new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(pts.map(p=>new V2(p[0],p[1])))),surfMat(R.tex.ceil));ce.rotation.x=Math.PI/2;ce.position.y=h;ce.visible=!!R.ceil;roomGroup.add(ce);roomGroup.userData.ceil=ce;
  const ccw=polyArea(pts)>0;const wm=surfMat(R.tex.wall);
  for(let i=0;i<pts.length;i++){
    const a=pts[i],b=pts[(i+1)%pts.length];const dx=b[0]-a[0],dz=b[1]-a[1];const len=Math.hypot(dx,dz);if(len<0.01)continue;
    const g=new THREE.PlaneGeometry(len,h);const uv=g.attributes.uv;for(let j=0;j<uv.count;j++)uv.setXY(j,uv.getX(j)*len,uv.getY(j)*h);
    const m=new THREE.Mesh(g,wm);m.position.set((a[0]+b[0])/2,h/2,(a[1]+b[1])/2);m.rotation.y=Math.atan2(-dz,dx);
    const nx=ccw?dz:-dz,nz=ccw?-dx:dx;const nl=Math.hypot(nx,nz)||1;
    walls.push({m,mx:m.position.x,mz:m.position.z,nx:nx/nl,nz:nz/nl});roomGroup.add(m);
  }
}

function inPoly(x,z,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if(((a[1]>z)!==(b[1]>z))&&(x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function rayPolyDist(px,pz,dx,dz,pts){let best=Infinity;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];const ex=b[0]-a[0],ez=b[1]-a[1];const den=dx*ez-dz*ex;if(Math.abs(den)<1e-9)continue;

function rnd(seed){let s=seed|0;return()=>{s=(s+0x6D2B79F5)|0;let q=Math.imul(s^(s>>>15),1|s);q=(q+Math.imul(q^(q>>>7),61|q))^q;return((q^(q>>>14))>>>0)/4294967296;};}

function mhOffset(o,beat){const s=o.msize==null?25:o.msize;const ph=((beat/4)*(o.mspd||0.5)+(o.mph||0))*Math.PI*2;
  switch(o.move){case 'circle':return[s*Math.cos(ph),s*0.6*Math.sin(ph)];case 'eight':return[s*Math.sin(ph),s*0.45*Math.sin(2*ph)];
    case 'sweep':return[s*Math.sin(ph),0];case 'tilt':return[0,s*0.6*Math.sin(ph)];
    case 'random':{const k=hashStr(o.id)%100;return[s*(0.6*Math.sin(ph*1.3+k)+0.4*Math.sin(ph*0.71+k*2)),s*0.5*(0.6*Math.sin(ph*0.9+k*3)+0.4*Math.sin(ph*1.7))];}}
  return[0,0];}

const modelCache={};
function loadModel(mid){
  if(modelCache[mid])return modelCache[mid];const rec=P.models&&P.models.find(m=>m.id===mid);const c=modelCache[mid]={status:'loading',scene:null};
  if(!rec||!THREE.GLTFLoader){c.status='error';return c;}
  (async()=>{try{const b=await refBlob(rec);let buf=await b.arrayBuffer();const head=new Uint8Array(buf.slice(0,4));const isGlb=head[0]===0x67&&head[1]===0x6c&&head[2]===0x54&&head[3]===0x46;
    let data=buf;if(!isGlb){const txt=new TextDecoder().decode(buf);const j=JSON.parse(txt);if(j.stagelabGlb){const bin=atob(j.stagelabGlb);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);data=u.buffer;}else data=txt;}
    new THREE.GLTFLoader().parse(data,'',gl=>{const sc=gl.scene;sc.traverse(n=>{if(n.isMesh){const m0=Array.isArray(n.material)?n.material[0]:n.material;n.material=mkMat({color:m0&&m0.color?'#'+m0.color.getHexString():'#aaaaaa',map:m0&&m0.map||null});}});
      const bb=new THREE.Box3().setFromObject(sc);const sz=bb.getSize(new V3());const k=1/Math.max(sz.x,sz.y,sz.z,0.001);sc.scale.setScalar(k);const bb2=new THREE.Box3().setFromObject(sc);const ctr=bb2.getCenter(new V3());sc.position.set(-ctr.x,-bb2.min.y,-ctr.z);
      const wrap=new THREE.Group();wrap.add(sc);c.scene=wrap;c.status='ok';P.objs.filter(o=>o.type==='model'&&o.modelId===mid).forEach(o=>rebuildObj(o));},()=>{c.status='error';toast(t('model.loadFail'));});
  }catch(e){c.status='error';toast(t('model.loadFail'));}})();
  return c;
}

function footprint(o){
  switch(o.type){
    case 'haky':case 'riser':case 'box':case 'bar':case 'dav':return[o.w,o.d];case 'table':return[o.w,o.shape==='rect'?o.d:o.w];
    case 'djbooth':return[o.w,0.7];case 'desk':return[o.w,0.8];case 'igelit':return[o.len,0.12];case 'wall':return[o.len,o.t||0.15];
    case 'pipe':case 'truss':return[o.len*Math.abs(Math.cos((o.rz||0)*deg))+(o.type==='truss'?o.size||0.29:0.06),o.type==='truss'?o.size||0.29:0.08];
    case 'goalpost':return[o.w+(o.size||0.29),o.size||0.29];case 'column':return[o.r*2,o.r*2];
    case 'panel':return[o.w,o.style==='ledwall'?0.15:0.1];case 'cutout':return[o.size,0.08];case 'person':return[0.5,0.35];
    case 'sunstrip':case 'pixelbar':case 'uvbar':return[o.len*Math.abs(Math.cos((o.rz||0)*deg))+0.12,0.14];case 'ledbar':return[Math.max(0.1,o.len*Math.abs(Math.cos((o.rz||0)*deg))),0.1];
    case 'festoon':return[o.len,0.1];case 'barrier':return[o.len,0.7];
    case 'ledsquare':return[o.s,o.s];case 'strobe':return[0.52,0.26];case 'blinder':return[(o.cells<=4?2:4)*0.22+0.06,0.16];
    case 'speaker':return o.kind==='sub'?[0.6,0.75]:o.kind==='monitor'?[0.55,0.42]:o.kind==='line'?[0.7,0.5]:[0.4,0.38];
    case 'mhwash':case 'mhspot':case 'mhbeam':return[0.38,0.32];case 'hazer':return[0.5,0.3];case 'laser':return[0.25,0.3];
    case 'model':return[o.size||1,o.size||1];case 'follow':return[0.25,0.9];case 'profile':return[0.28,0.7];
  }
  return[0.3,0.3];
}
const objY=o=>o.type==='ledsquare'&&o.y<0?P.room.h-0.06:(o.y||0);
function objExt(o){const[fw,fd]=footprint(o);const a=(o.ry||0)*deg;const hx=Math.abs(fw/2*Math.cos(a))+Math.abs(fd/2*Math.sin(a)),hz=Math.abs(fw/2*Math.sin(a))+Math.abs(fd/2*Math.cos(a));

/* =========================================================
   Rad tanečných HAKY za DJ-om
   ========================================================= */
function stageFrame(r){const a=(r.ry||0)*deg;return{X:r.x,Z:r.z,c:Math.cos(a),s:Math.sin(a)};}
const toW=(f,lx,lz)=>[+(f.X+lx*f.c+lz*f.s).toFixed(3),+(f.Z-lx*f.s+lz*f.c).toFixed(3)];
const toL=(f,x,z)=>{const dx=x-f.X,dz=z-f.Z;return[dx*f.c-dz*f.s,dx*f.s+dz*f.c];};
const chainDims=r=>r.chainRot?[r.d,r.w]:[r.w,r.d];
function rearGap(proj,r,n,dims){const f=stageFrame(r);const[wp,dp]=dims||chainDims(r);const depth=r.d/2+n*dp,W=n?wp:r.w;const pts=proj.room.pts;
  return Math.min(...[-1,1].map(s=>{const[x,z]=toW(f,s*W/2,-depth);if(inPoly(x,z,pts))return rayPolyDist(x,z,-f.s,-f.c,pts);const tt=rayPolyDist(x,z,f.s,f.c,pts);return isFinite(tt)?-tt:Infinity;}));}
function genChain(proj,r){
  const f=stageFrame(r);const[wp,dp]=chainDims(r);const out=[];const n=r.chainN||0;
  for(let k=1;k<=n;k++){const lzc=-(r.d/2+(k-1)*dp+dp/2);const[x,z]=toW(f,0,lzc);
    out.push(O('haky',{name:t('chain.haky',{k}),w:wp,d:dp,h:r.h,deck:r.deck,x,z,ry:r.ry||0,chainOf:r.id}));
    const sl=+((wp-0.16)/2).toFixed(2);
    [-1,1].forEach(s=>{const[sx,sz]=toW(f,s*(sl/2+0.02),lzc-dp/2+0.06);out.push(O('sunstrip',{name:t('chain.sun',{k})+' '+(s<0?t('side.L'):t('side.R')),len:sl,y:2.05,x:sx,z:sz,ry:r.ry||0,chainOf:r.id}));});
    out.push(O('dav',{name:t('chain.people',{k}),w:+Math.max(0.6,wp-0.5).toFixed(2),d:+Math.max(0.6,dp-0.6).toFixed(2),count:5,y:r.deck,x,z,ry:r.ry||0,chainOf:r.id}));}
  if(r.g)out.forEach(o=>o.g=r.g);
  proj.objs.push(...out);return out;
}
function chainRootOf(objs){
  const hk=objs.filter(o=>o.type==='haky');if(!hk.length)return null;const c=hk.find(o=>o.chainOf);if(c)return objById(c.chainOf);
  const withN=hk.find(o=>o.chainN!=null);if(withN)return withN;
  let best=null,bc=-1;hk.forEach(h=>{const f=stageFrame(h);const cnt=hk.filter(q=>q!==h&&toL(f,q.x,q.z)[1]<-0.2).length;if(cnt>bc){bc=cnt;best=h;}});return best;
}
function setChain(r,n){
  n=clamp(Math.round(n),0,6);const f=stageFrame(r);
  let oldN=r.chainN||0,oldDims=chainDims(r);const remove=new Set(P.objs.filter(o=>o.chainOf===r.id).map(o=>o.id));
  if(r.chainN==null){/* staršie projekty: tanečné HAKY postavené ručne */
    const leg=P.objs.filter(q=>q.type==='haky'&&q!==r&&!q.chainOf&&(()=>{const[lx,lz]=toL(f,q.x,q.z);return Math.abs(lx)<0.6&&lz<0;})()).sort((a,b)=>toL(f,b.x,b.z)[1]-toL(f,a.x,a.z)[1]);
    if(leg.length){oldN=leg.length;r.chainRot=Math.abs(leg[0].w-r.w)>0.05?1:0;oldDims=[leg[0].w,leg[0].d];
      leg.forEach(q=>{remove.add(q.id);const fq=stageFrame(q);P.objs.forEach(o=>{if(!['sunstrip','dav','person'].includes(o.type)||o===q)return;const[lx,lz]=toL(fq,o.x,o.z);if(Math.abs(lx)<=q.w/2+0.15&&Math.abs(lz)<=q.d/2+0.15)remove.add(o.id);});});}}
  const gap0=rearGap(P,r,oldN,oldDims);
  const depth0=r.d/2+oldN*oldDims[1];
  const stage=new Set([r.id]);

function fxv(fx,beat,z,tt){
  const ph=((beat%1)+1)%1;
  switch(fx){
    case 'static':return 1;
    case 'pulse':return 0.3+0.7*Math.exp(-ph*4.5);
    case 'chase':{const c=0.5+0.5*Math.cos(2*Math.PI*(beat*0.25+z/8));return 0.08+0.92*Math.pow(c,4);}
    case 'breath':return 0.5+0.45*Math.sin(tt*1.1+z*0.3);
    case 'random':{const k=Math.floor(beat*2);const h=Math.sin(k*12.9898+z*78.233)*43758.5453;return(h-Math.floor(h))>0.55?1:0.08;}
    case 'off':return 0;
  }
  return 1;
}
function strobeLvl(o,beat,tt,bpm){const hz=o.hz||12,dur=(o.dur||40)/1000;const flash=((tt*hz)%1)<Math.min(0.85,dur*hz);
  switch(o.mode||'drop'){case 'on':return flash?1:0;case 'drop':{const bar=Math.floor(beat/4)%8;return bar>=6&&flash?1:0;}
    case 'beat':{const ph=((beat%1)+1)%1;return ph*60/bpm<dur*1.5?1:0;}case 'bar':{const ph=(((beat/4)%1)+1)%1;return ph*240/bpm<dur*1.5?1:0;}}return 0;}
const tmpC=new THREE.Color();let lightCount=0,lightTotal=0;const cand=[];
function updateLights(beat,tt){
  const E=P.env;const work=!!E.work;cand.length=0;

    g.userData.lights.forEach(e=>{

      const fxRaw=(e.panel||e.kind===3)?'static':(o.fx||'scene');const fx=fxRaw==='scene'?E.fx:fxRaw;
      const spd=o.spd||1,bb=beat*spd+(o.ph||0);
      let f=e.strobe?strobeLvl(o,beat,tt,E.bpm):fxv(fx,bb,e.pos.z,tt*spd+(o.ph||0));
      if(o.type==='lamp'&&o.flicker)f*=0.72+0.28*Math.abs(Math.sin(tt*23+o.x*7)*Math.sin(tt*13.7+o.z));
      if(work&&!e.strobe)f*=0.35;
      e.f=f;e.cur=e.int*f;
      if(e.emit.length){
        if(e.cells&&fx==='chase'){e.emit.forEach((m,i)=>{const c=0.5+0.5*Math.cos(2*Math.PI*(bb*1.5-i/e.emit.length));const k=0.12+0.88*Math.pow(c,3);m.color.copy(e.col).multiplyScalar(Math.min(1.4,0.2+k*f*1.2));});}
        else{tmpC.copy(e.col).multiplyScalar(Math.min(1.4,0.25+f*1.1));e.emit.forEach(m=>m.color.copy(tmpC));}}
      if(e.beam){const hz=Math.max(E.haze,selSet.has(o.id)?0.45:0);e.beam.mesh.visible=hz>0.02&&mode==='3d'&&!work&&e.cur>0.01;e.beam.mat.uniforms.uCol.value.copy(e.col);
        e.beam.mat.uniforms.uI.value=Math.max(f,selSet.has(o.id)?0.6:0)*Math.min(1.5,e.int/2.5)*hz*1.4*(o.type==='mhbeam'?1.8:1);}
      if(e.cur>0.001||e.kind===3){const p=e.kind===2?e.pos.clone().lerp(e.b,0.5):e.pos;const d=Math.max(0,p.distanceTo(camera.position)-e.range);e.score=(e.cur+0.05)*e.range/(1+d*d*0.05);cand.push(e);}
    });

  LU.uExp.value=E.bright;{const dz=P.objs.find(q=>q.type==='disco');LU.uDiscoRot.value=tt*(dz&&dz.speed!=null?dz.speed:0.45);}workU.value=work?1:0;

  /* výrezy presvietené zozadu */
  objMap.forEach(g=>{const gl=g.userData.glow;if(!gl)return;const wp=new V3();g.getWorldPosition(wp);let r=0,gg=0,b=0;
    objMap.forEach(g2=>g2.userData.lights.forEach(e=>{if(e.kind===4||e.kind===3||!e.cur)return;const p=e.kind===2?e.pos.clone().lerp(e.b,0.5):e.pos;const d=p.distanceTo(wp);if(d<2.2){const k=e.cur*(1-d/2.2)*0.5;r+=e.col.r*k;gg+=e.col.g*k;b+=e.col.b*k;}}));

}
function animateObjs(beat,tt,dt){

    if(A.type==='crowd')A.people.forEach(c=>{const b=Math.abs(Math.sin((beat+c.ph*0.3)*Math.PI));c.h.g.position.y=b*0.035*c.amp;if(c.up){c.h.aR.rotation.x=-2.6-0.25*b;}else{c.h.aR.rotation.x=-0.15-0.15*b;c.h.aL.rotation.x=-0.15-0.12*b;}});

    else if(A.type==='laser'){const o=A.o;const fx=o.fx&&o.fx!=='scene'?o.fx:E.fx;const f=E.work?0:fxv(fx,beat*(o.spd||1)+(o.ph||0),o.z,tt);
      const n=A.beams.length,fan=(o.fan||70)*deg,sp=o.speed==null?0.5:o.speed;const sweep=o.mode==='static'?0:Math.sin(tt*sp*2)*fan*0.35;const tilt=o.mode==='wave'?Math.sin(tt*sp*3)*0.25:0;
      A.beams.forEach((m,i)=>{const u=n>1?i/(n-1)-0.5:0;m.rotation.y=u*fan+sweep;m.rotation.x=tilt+(o.mode==='wave'?Math.sin(tt*sp*4+i)*0.12:0);});

      for(let i=0;i<N;i++){A.life[i]=(A.life[i]+dt*0.12)%1;const l=A.life[i];const s=hashStr(o.id)+i*7.31;

let ed=null;
$('#fileImg').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;openImageFile(f);});
function openImageFile(f){const url=URL.createObjectURL(f);openEditor(url,null,f.name.replace(/\.[^.]+$/,''),f.type==='image/png');}
function openEditor(url,existing,name,isPng){
  const img=new Image();img.onload=()=>{
    const max=2048;const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const src=document.createElement('canvas');src.width=Math.round(img.naturalWidth*k);src.height=Math.round(img.naturalHeight*k);src.getContext('2d').drawImage(img,0,0,src.width,src.height);
    const pk=Math.min(1,640/Math.max(src.width,src.height));const prev=document.createElement('canvas');prev.width=Math.round(src.width*pk);prev.height=Math.round(src.height*pk);prev.getContext('2d').drawImage(src,0,0,prev.width,prev.height);
    ed={src,prev,prevData:prev.getContext('2d').getImageData(0,0,prev.width,prev.height),existing,name:name||(existing&&existing.name)||t('photos.default'),png:isPng||(existing&&existing.png),adj:{b:0,c:0,s:0,h:0,warm:0},rot:0,flip:false};
    renderEditor();};
  img.onerror=()=>toast(t('photos.openFail'));img.crossOrigin='anonymous';img.src=url;
}
function applyAdj(data,a){
  if(!a.b&&!a.c&&!a.s&&!a.h&&!a.warm)return data;
  const d=data.data,b=a.b*1.2,c=(a.c+100)/100,s=(a.s+100)/100,hr=a.h*deg,warm=a.warm;
  const cosH=Math.cos(hr),sinH=Math.sin(hr);
  const m=[0.213+cosH*0.787-sinH*0.213,0.715-cosH*0.715-sinH*0.715,0.072-cosH*0.072+sinH*0.928,0.213-cosH*0.213+sinH*0.143,0.715+cosH*0.285+sinH*0.140,0.072-cosH*0.072-sinH*0.283,0.213-cosH*0.213-sinH*0.787,0.715-cosH*0.715+sinH*0.715,0.072+cosH*0.928+sinH*0.072];
  for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],bl=d[i+2];
    if(a.h){const r2=r*m[0]+g*m[1]+bl*m[2],g2=r*m[3]+g*m[4]+bl*m[5],b2=r*m[6]+g*m[7]+bl*m[8];r=r2;g=g2;bl=b2;}
    r+=b+warm;g+=b;bl+=b-warm;r=(r-128)*c+128;g=(g-128)*c+128;bl=(bl-128)*c+128;
    const l=0.299*r+0.587*g+0.114*bl;r=l+(r-l)*s;g=l+(g-l)*s;bl=l+(bl-l)*s;
    d[i]=r<0?0:r>255?255:r;d[i+1]=g<0?0:g>255?255:g;d[i+2]=bl<0?0:bl>255?255:bl;}
  return data;
}
function renderTo(srcCanvas,data,rot,flip){
  const w=srcCanvas.width,h=srcCanvas.height;const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;tmp.getContext('2d').putImageData(data,0,0);
  const out=document.createElement('canvas');const sw=rot%180===0;out.width=sw?w:h;out.height=sw?h:w;const g=out.getContext('2d');
  g.translate(out.width/2,out.height/2);g.rotate(rot*deg);if(flip)g.scale(-1,1);g.drawImage(tmp,-w/2,-h/2);return out;
}
function renderEditor(){
  const box=modalBox(t('ed.title'));
  modalHead(box,ed.existing?t('ed.edit'):t('ed.new'));
  const show=el('canvas',{class:'edcanvas'});box.appendChild(show);
  const redraw=()=>{const data=new ImageData(new Uint8ClampedArray(ed.prevData.data),ed.prev.width,ed.prev.height);applyAdj(data,ed.adj);const out=renderTo(ed.prev,data,ed.rot,ed.flip);show.width=out.width;show.height=out.height;show.getContext('2d').drawImage(out,0,0);};
  let q=false;const later=()=>{if(q)return;q=true;requestAnimationFrame(()=>{q=false;redraw();});};

  box.appendChild(el('div',{class:'f'},[el('label',{for:'edname',text:t('common.name')}),nm]));
  const A=ed.adj;const fr=(l,k,min,max)=>{const r=fRange(l,()=>A[k],v=>A[k]=v,{min,max,step:1,dec:0,live:later});r.querySelectorAll('input').forEach(i=>i.addEventListener('change',e=>e.stopImmediatePropagation(),true));return r;};
  [fr(t('ed.b'),'b',-100,100),fr(t('ed.c'),'c',-80,100),fr(t('ed.s'),'s',-100,100),fr(t('ed.warm'),'warm',-60,60),fr(t('ed.h'),'h',-180,180)].forEach(r=>box.appendChild(r));
  box.appendChild(el('div',{class:'row2'},[el('button',{type:'button',class:'chip',text:t('ed.rot'),onclick:()=>{ed.rot=(ed.rot+90)%360;redraw();}}),el('button',{type:'button',class:'chip',text:t('ed.flip'),onclick:()=>{ed.flip=!ed.flip;redraw();}}),el('button',{type:'button',class:'chip',text:t('ed.reset'),onclick:()=>{Object.assign(A,{b:0,c:0,s:0,h:0,warm:0});ed.rot=0;ed.flip=false;renderEditor();}})]));
  const save=el('button',{type:'button',class:'chip acc',text:t('ed.save')});
  save.onclick=async()=>{save.disabled=true;save.textContent=t('st.saving');
    const data=ed.src.getContext('2d').getImageData(0,0,ed.src.width,ed.src.height);applyAdj(data,ed.adj);const out=renderTo(ed.src,data,ed.rot,ed.flip);
    const type=ed.png?'image/png':'image/jpeg';let blob=await new Promise(r=>out.toBlob(r,type,0.9));
    if(!assets&&!IDB.h&&!ed.png){const k=Math.min(1,1024/Math.max(out.width,out.height));const sm=document.createElement('canvas');sm.width=out.width*k;sm.height=out.height*k;sm.getContext('2d').drawImage(out,0,0,sm.width,sm.height);blob=await new Promise(r=>sm.toBlob(r,'image/jpeg',0.82));}
    const st=await storeBlob(blob,type);let id;
    if(ed.existing){const ph=P.photos.find(p=>p.id===ed.existing.id);if(ph){const old={asset:ph.asset,blob:ph.blob};delete ph.asset;delete ph.blob;delete ph.data;Object.assign(ph,st,{name:ed.name,png:ed.png});id=ph.id;deleteRef(old);}}
    else{const ph=Object.assign({id:uid(),name:ed.name||t('photos.default'),note:'',png:ed.png},st);P.photos.push(ph);selPhoto=ph.id;id=ph.id;}
    Object.keys(photoTexCache).forEach(k=>delete photoTexCache[k]);
    closeModal();commit();if(ed.existing)rebuildAll();planDirty=true;
    const cb=pickPhotoCb;pickPhotoCb=null;if(cb){cb(id);}else{tab='photos';renderTabs();renderPanel();}toast(t('photos.saved'));};
  box.appendChild(el('div',{class:'row2',style:'margin-top:12px;justify-content:flex-end'},[el('button',{type:'button',class:'chip',text:t('common.cancel'),onclick:()=>{pickPhotoCb=null;closeModal();}}),save]));
  redraw();
}

async function importModelFile(f){
  if(!THREE.GLTFLoader){toast(t('model.loadFail'));return;}
  if(f.size>40*1048576){toast(t('model.tooBig'));return;}

function viewAt(st,u){const v=P.views[st.vi]||P.views[0];const pos=new V3(...v.pos),tgt=new V3(...v.tgt);
  if(st.orbit&&u>0){const off=pos.clone().sub(tgt);const a=u*Math.PI*2*(st.orbit<0?-1:1);const c=Math.cos(a),s=Math.sin(a);pos.set(tgt.x+off.x*c+off.z*s,pos.y,tgt.z-off.x*s+off.z*c);}

  camera.position.copy(p);controls.target.copy(g);camera.lookAt(g);

}

/* =========================================================
   Veľkosť okna, hlavná slučka, štart
   ========================================================= */
let prevVW=0,prevVH=0;
function onResize(){if(rec&&rec.size)return;const w=Math.max(1,viewEl.clientWidth),h=Math.max(1,viewEl.clientHeight);
  if(prevVW&&mode==='plan'){pv.ox+=(w-prevVW)/2;pv.oy+=(h-prevVH)/2;}if(mode==='plan'){prevVW=w;prevVH=h;}
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<0.8?68:58;camera.updateProjectionMatrix();planDirty=true;}
window.addEventListener('resize',onResize);
if(window.ResizeObserver)new ResizeObserver(onResize).observe(viewEl);

const clock=new THREE.Clock();let T=0;
function frame(){
  const rawDt=clock.getDelta();const dt=Math.min(rawDt,0.05);T+=dt;
  if(P){
    const beat=T*P.env.bpm/60;
    if(mode==='3d'){
      if(camTween.on){camTween.t=Math.min(1,camTween.t+dt/0.9);const e=camTween.t<.5?2*camTween.t*camTween.t:1-Math.pow(-2*camTween.t+2,2)/2;camera.position.lerpVectors(camTween.fp,camTween.tp,e);controls.target.lerpVectors(camTween.ft,camTween.tt,e);if(camTween.t>=1){camTween.on=false;syncWalkFromCam();}}
      if(tour)driveTour(Math.min(rawDt,0.5));else driveCamera(dt);
      const above=camera.position.y>P.room.h-0.02;const ce=roomGroup.userData.ceil;if(ce)ce.visible=!!P.room.ceil&&!above;
      walls.forEach(w=>{const out=(camera.position.x-w.mx)*w.nx+(camera.position.z-w.mz)*w.nz;w.m.visible=out>-0.05;});
      updateLights(beat,T);animateObjs(beat,T,dt);
      if(selSet.size&&!rec&&objMap.size){/* rámik sleduje pohyblivé hlavy */const s=objById(sel);if(s&&MH_TYPES.includes(s.type)&&s.move&&s.move!=='none')selBoxes.forEach((b,i)=>{const g=objMap.get([...selSet][i]);if(g&&b.visible)b.setFromObject(g);});}
      if(rec&&!tour){const sec2=(performance.now()-rec.t0)/1000;$('#recTime').textContent=fmtT(sec2);if(sec2>300)stopRec();}
      renderer.render(scene,camera);
    } else if(planDirty) drawPlan();
  }
  requestAnimationFrame(frame);
}

/* ---------- štart ---------- */
applyStaticI18n();renderTabs();onResize();requestAnimationFrame(frame);
(async()=>{
  status('st.connecting');
  await idbOpen();await migrateLocal();
  if(inClaude()){
    const use=n=>Promise.race([window.claude.use(n).catch(()=>null),new Promise(r=>setTimeout(()=>r(null),4000))]);
    db=await use('db');
    use('assets').then(a=>{assets=a;if(tab==='photos'&&P)renderPanel();});
    getDownloads();
  }
  storeMode=db?'db':'local';
  const last=lsGet('stagelab-last');
  let p=null;
  if(last)p=await loadProject(last);
  if(!p){const items=await listProjects();if(items[0])p=await loadProject(items[0].id);}
  if(p)await openProject(p);else await openProject(tplChodba(),true);
  setHint();
  if(!lsGet('stagelab-help-seen'))openHelp();
})();
window.__stage={get P(){return P;},get selSet(){return selSet;},get sel(){return sel;},get tour(){return tour;},get wallTool(){return wallTool;},get lightCount(){return lightCount;},get lightTotal(){return lightTotal;},
  setChain,openVideo,startTour,doAlign,distribute,groupSel,ungroupSel,doArray,arrayCfg,addCfg,toggleRoomEdit,openHelp,openSettings,setLang,panelSize,renderer,scene,camera,controls,LU,setMode,setNav,select,setView,addObj,
  startWallTool,endWallTool,startCal,pv:()=>pv,wallAddTyped,setBackdrop,setGizmoMode,gizmo,pivot,rebuildAll,commit,undo,objMap,
  tab:k=>{tab=k;renderTabs();renderPanel();}};
})();
